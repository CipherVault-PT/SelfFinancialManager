<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080A11">
<meta name="description" content="A tua carteira de investimentos toda num sítio — cripto, ações e ETFs, ao vivo.">
<title>Aurora Investments</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aurora">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;450;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<script type="module" src="js/main.js"></script>
</head>
<body>

<div class="aurora-base"></div><canvas id="aurC" class="aurora-c" aria-hidden="true"></canvas>

<header><div class="wrap head">
  <div class="brand"><span class="gem"><svg viewBox="0 0 40 48" aria-hidden="true"><defs><linearGradient id="hg" x1="30%" y1="0%" x2="70%" y2="100%"><stop offset="0%" stop-color="#E9D39B"/><stop offset="34%" stop-color="#C9A96A"/><stop offset="62%" stop-color="#5FC79A"/><stop offset="100%" stop-color="#7C6CE0"/></linearGradient><linearGradient id="hr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F0DCA8"/><stop offset="1" stop-color="#B8965A"/></linearGradient></defs><path d="M20 3 L37 20 L20 45 L3 20 Z" fill="url(#hg)"/><path d="M20 3 L37 20 L3 20 Z" fill="#fff" opacity=".16"/><path d="M3 20 L20 20 L20 45 Z" fill="#000" opacity=".14"/><path d="M20 3 L37 20 L20 45 L3 20 Z" fill="none" stroke="url(#hr)" stroke-width="1.6" stroke-linejoin="round"/><line x1="3" y1="20" x2="37" y2="20" stroke="url(#hr)" stroke-width="1" opacity=".7"/><path class="shimmer" d="M20 5 L28 17 L20 17 Z" fill="#fff" opacity="0"/></svg></span><b>Aurora</b><small>investments</small></div>
  <div class="head-r">
    <div class="status" role="status" aria-live="polite"><span class="dot stale" id="dot"></span><span id="statusTxt">A carregar…</span></div>
    <div class="seg" id="curSeg" aria-label="Moeda">
      <button type="button" data-cur="EUR" class="on">€</button>
      <button type="button" data-cur="USD">$</button>
    </div>
    <button type="button" class="btn icon ghost" id="btnRefresh" data-action="refresh" title="Atualizar cotações" aria-label="Atualizar cotações">↻</button>
    <button type="button" class="btn pri" data-action="add">＋<span class="btn-lbl"> Posição</span></button>
    <button type="button" class="btn pwa-btn" id="btnInstall" title="Instalar como app" hidden>📲 <span class="pwa-lbl">Instalar app</span></button>
    <button type="button" class="btn icon ghost" data-action="settings" title="Definições" aria-label="Definições">⚙</button>
  </div>
</div></header>

<main class="wrap">
  <section class="hero">
    <div class="eyebrow">Património total</div>
    <div class="nw" id="nw"><span class="cur">€</span>0<span class="dec">,00</span></div>
    <div class="hero-sub" id="heroSub"></div>
    <div class="ribbon" id="ribbon"></div>
    <div class="rleg" id="rleg"></div>
  </section>

  <section class="tiles" id="tiles"></section>

  <nav class="tabs" role="tablist">
    <button type="button" role="tab" data-tab="painel" class="on" aria-selected="true">Painel</button>
    <button type="button" role="tab" data-tab="posicoes" aria-selected="false">Posições<span class="count" id="cOpen"></span></button>
    <button type="button" role="tab" data-tab="historico" aria-selected="false">Histórico<span class="count" id="cClosed"></span></button>
  </nav>

  <section id="view"></section>
</main>

<div class="ov" id="ov" aria-hidden="true"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"><span class="ti"></span><span id="toastTxt"></span></div>
<noscript><p style="padding:24px;text-align:center">A Aurora precisa de JavaScript ativo.</p></noscript>

</body>
</html>
