<style>
:root{
  --bg:#0A0D16; --bg-2:#0C1019; --surface:#121826; --surface-2:#171F30;
  --line:rgba(160,178,214,.09); --line-2:rgba(160,178,214,.16);
  --brass:#C9A96A; --brass-2:#DFC48C; --brass-dim:rgba(201,169,106,.14);
  --text:#ECEEF4; --muted:#8B93A8; --muted-2:#5E6883;
}
:root{
  --up:#54C295; --up-dim:rgba(84,194,149,.13);
  --down:#E37B61; --down-dim:rgba(227,123,97,.13);
  --indigo:#7E8CE8; --slate:#5C6784;
  --r:16px; --r-sm:11px; --r-lg:22px;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --disp:'Space Grotesk',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--text); font-family:var(--body);
  font-size:15px; line-height:1.5; letter-spacing:-.006em;
  -webkit-font-smoothing:antialiased; padding-bottom:80px;
  background-image:radial-gradient(1200px 600px at 82% -8%, rgba(126,140,232,.06), transparent 60%),
                   radial-gradient(900px 500px at 8% 4%, rgba(201,169,106,.05), transparent 55%);
  min-height:100vh;
}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:0}
.up{color:var(--up)} .down{color:var(--down)}

/* aurora boreal viva (canvas) + brilho base */
.aurora-c{position:fixed;top:0;left:0;width:100%;height:64vh;z-index:-2;pointer-events:none;
  -webkit-mask:linear-gradient(180deg,#000 46%,transparent);mask:linear-gradient(180deg,#000 46%,transparent)}
.aurora-base{position:fixed;inset:0;z-index:-3;pointer-events:none;background:
  radial-gradient(60vw 34vh at 20% -6%,rgba(201,169,106,.16),transparent 70%),
  radial-gradient(52vw 30vh at 82% -4%,rgba(95,199,154,.12),transparent 70%),
  radial-gradient(46vw 30vh at 55% -10%,rgba(124,108,224,.12),transparent 70%),var(--bg)}
/* entrada em cascata dos cartões */
@keyframes cardStagger{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
.pos,.tile{animation:cardStagger .5s cubic-bezier(.2,.7,.2,1) backwards}
.tile:nth-child(1){animation-delay:.03s}.tile:nth-child(2){animation-delay:.09s}.tile:nth-child(3){animation-delay:.15s}.tile:nth-child(4){animation-delay:.21s}
.pos:nth-child(1){animation-delay:.05s}.pos:nth-child(2){animation-delay:.11s}.pos:nth-child(3){animation-delay:.17s}.pos:nth-child(4){animation-delay:.23s}.pos:nth-child(5){animation-delay:.29s}.pos:nth-child(6){animation-delay:.35s}.pos:nth-child(7){animation-delay:.41s}.pos:nth-child(8){animation-delay:.46s}
/* transição entre separadores */
@keyframes tabFade{from{opacity:0;transform:translateY(8px);filter:blur(2px)}to{opacity:1;transform:translateY(0);filter:blur(0)}}
.tabfx{animation:tabFade .4s ease}
@media (prefers-reduced-motion:reduce){.pos,.tile,.tabfx{animation:none}}

/* header */
header{position:sticky;top:0;z-index:40;backdrop-filter:blur(14px);
  background:linear-gradient(180deg,rgba(10,13,22,.92),rgba(10,13,22,.72));
  border-bottom:1px solid var(--line)}
.head{display:flex;align-items:center;gap:14px;height:60px}
.brand{display:flex;align-items:center;gap:11px;font-family:var(--disp);font-weight:600;
  font-size:18px;letter-spacing:.01em}

/* breakdown bars */

const MIC={'Lisboa':'XLIS','Xetra':'XETR','Paris':'XPAR','Amesterdão':'XAMS','Madrid':'XMAD','Milão':'XMIL','Londres':'XLON','Zurique':'XSWX','Copenhaga':'XCSE','Dublin':'XMSM'};
const ETF_MIC={'VUAA':'XETR','CSPX':'XLON','SPYL':'XETR'};
function stockHomeCur(p){ const s=STOCKS.find(x=>x.t===p.symbol); return s?s.c:p.currency; }
function stockMic(sym){ if(ETF_MIC[sym])return ETF_MIC[sym]; const s=STOCKS.find(x=>x.t===sym); return s?(MIC[s.x]||''):''; }
function posTotals(p){ // agrega várias entradas (lots) ou converte posição antiga
  if(p.lots&&p.lots.length){ let s=0,c=0; for(const l of p.lots){ s+=(+l.shares||0); c+=(+l.cost||0); } return {shares:s,cost:c}; }
  const s=p.entryPrice>0?p.invested/p.entryPrice:0; return {shares:s,cost:p.invested||0};
}
function pCost(p){ return posTotals(p).cost; }
function pAvg(p){ const t=posTotals(p); return t.shares>0?t.cost/t.shares:0; }
function cashEntries(c){ return c.entries || (c.amount>0?[{amount:c.amount,kind:'deposit',date:c.date||''}]:[]); }
function cashBal(c){ return cashEntries(c).reduce((s,e)=>s+e.amount,0); }
function cashBreak(c){ let d=0,i=0; for(const e of cashEntries(c)){ if(e.kind==='interest')i+=e.amount; else d+=e.amount; } return {deposit:d, interest:i}; }
function avgDisp(p){ // preço médio na moeda de execução (bate com o broker), se disponível
  const lots=p.lots||[];
  if(lots.length && lots.every(l=>l.priceQ>0 && l.priceCur) && lots.every(l=>l.priceCur===lots[0].priceCur)){
    let sw=0,ss=0; for(const l of lots){ sw+=l.shares*l.priceQ; ss+=l.shares; }
    return {value:ss>0?sw/ss:0, cur:lots[0].priceCur};
  }
  return {value:pAvg(p), cur:p.currency};
}
function qty(p){ return posTotals(p).shares; }
function fxFresh(){ return !!(state.cache.fxUpdated && (Date.now()-state.cache.fxUpdated < 2*24*3600*1000)); }
function fxAgo(){ if(!state.cache.fxUpdated)return''; const s=Math.floor((Date.now()-state.cache.fxUpdated)/1000);
  if(s<90)return'agora mesmo'; if(s<3600)return'há '+Math.floor(s/60)+' min'; if(s<86400)return'há '+Math.floor(s/3600)+' h'; return'há '+Math.floor(s/86400)+' dias'; }
function priceInfo(p){ // preço atual + moeda nativa + se é ao vivo + variação do dia
  if(p.kind==='crypto'){ const q=state.cache.prices[p.coingeckoId];
    if(q)return{price:(p.currency==='EUR'?q.eur:q.usd),cur:p.currency,live:true,dayPct:(p.currency==='EUR'?q.eur_24h_change:q.usd_24h_change)??null};
    return{price:pAvg(p),cur:p.currency,live:false,dayPct:null}; }
  const lv=state.cache.stockPrices[p.symbol];
  const nativeCur=stockHomeCur(p), cross=nativeCur!==p.currency;
  // ação estrangeira (ex: cota em USD, conta em €): só converte ao vivo se o câmbio real estiver confirmado;
  // senão mostra o valor do relatório (manualPrice), nunca uma conversão com câmbio de reserva
  if(lv&&lv.price>0&&(!cross||fxFresh()))return{price:lv.price,cur:lv.cur||nativeCur,live:true,dayPct:(lv.dayPct!=null?lv.dayPct:null)};
  return{price:(p.manualPrice!=null?p.manualPrice:pAvg(p)),cur:p.currency,live:false,dayPct:null};
}
function metrics(p){
  const u=qty(p), cost=pCost(p), pi=priceInfo(p), valNative=u*pi.price;
  const fee=feeFor(p.platform);
  const feeAcct=(pi.cur!==p.currency)?(1-fee):1;   // XTB desconta a taxa de saída quando converte USD->€
  const feeDisp=(pi.cur!==disp())?(1-fee):1;
  const valPos=conv(valNative,pi.cur,p.currency)*feeAcct, plPos=valPos-cost, plp=cost>0?plPos/cost*100:0;
  const invD=conv(cost,p.currency), valD=conv(valNative,pi.cur)*feeDisp, plD=valD-invD;
  const dayPct=pi.dayPct, dayD=(dayPct!=null?valD*dayPct/100:0);
  return {u, cost, avg:pAvg(p), live:pi.live, nativePrice:pi.price, nativeCur:pi.cur, cp:conv(pi.price,pi.cur,p.currency)*feeAcct,
          valPos, plPos, invD, valD, plD, plp, dayPct, dayD};
}
function closedM(p){ const u=qty(p), cost=pCost(p), exCur=p.exitCur||p.currency;
  const proceeds=(p.proceeds!=null)?p.proceeds:conv(u*p.exitPrice,exCur,p.currency);
  const pl=proceeds-cost, plp=cost>0?pl/cost*100:0;
  return {u,exCur,proceeds,pl,plp,invD:conv(cost,p.currency),exD:conv(proceeds,p.currency,disp()),plD:conv(pl,p.currency,disp())}; }
function agg(){
  let inv=0,val=0,cryptoV=0,stockV=0,dayChange=0;
  state.positions.forEach(p=>{const m=metrics(p);inv+=m.invD;val+=m.valD;dayChange+=m.dayD; if(p.kind==='crypto')cryptoV+=m.valD;else stockV+=m.valD;});
  let cashV=0; state.cash.forEach(c=>cashV+=conv(cashBal(c),c.currency));
  let realized=0,wins=0,best=null,worst=null;
  state.closed.forEach(p=>{const m=closedM(p);realized+=m.plD; if(m.pl>0)wins++;
    if(best===null||m.plp>best.plp)best={...p,plp:m.plp,plD:m.plD}; if(worst===null||m.plp<worst.plp)worst={...p,plp:m.plp,plD:m.plD};});
  const netWorth=val+cashV, unreal=val-inv, unrealP=inv>0?unreal/inv*100:0, dayP=val>0?dayChange/val*100:0;
  return {inv,val,cryptoV,stockV,cashV,netWorth,unreal,unrealP,realized,dayChange,dayP,
    winRate:state.closed.length?wins/state.closed.length*100:0,best,worst,closedN:state.closed.length};
}

let stockBusy=false;
const YH_SUF={XETR:'.DE',XLON:'.L',XPAR:'.PA',XLIS:'.LS',XAMS:'.AS',XMIL:'.MI',XMAD:'.MC',XSWX:'.SW',XSTO:'.ST',XHEL:'.HE',XCSE:'.CO'};
function yahooSym(sym){ const mic=stockMic(sym); return sym+(YH_SUF[mic]||''); }
function yhWraps(t){ // ordem: proxy próprio (fiável) primeiro, depois públicos, depois direto
  const p=(state.settings.proxyUrl||'').trim(), arr=[];
  if(p) arr.push(p+(p.includes('?')?'&':'?')+'url='+encodeURIComponent(t));
  arr.push('https://api.allorigins.win/raw?url='+encodeURIComponent(t));
  arr.push('https://corsproxy.io/?url='+encodeURIComponent(t));
  arr.push('https://api.codetabs.com/v1/proxy/?quest='+encodeURIComponent(t));
  arr.push('https://thingproxy.freeboard.io/fetch/'+t);
  arr.push(t);
  return arr;
}
function yhParse(d,sym){ const m=d?.chart?.result?.[0]?.meta; if(!m||!(m.regularMarketPrice>0))return null;
  let px=m.regularMarketPrice, cur=m.currency||stockHomeCur({symbol:sym});
  if(cur==='GBp'||cur==='GBX'){ px/=100; cur='GBP'; }
  const prev=m.chartPreviousClose||m.previousClose;
  return {price:px, cur, dayPct:(prev>0?(px-prev)/prev*100:null)}; }
async function fetchYahoo(sym){ // cobre ETFs europeias que a Twelve Data grátis não dá
  const target=`https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(yahooSym(sym))}?interval=1d&range=5d`;
  for(const u of yhWraps(target)){
    try{ const r=await fetch(u); if(!r.ok)continue; const txt=await r.text(); let d; try{ d=JSON.parse(txt); }catch{ continue; }
      const q=yhParse(d,sym); if(q)return q;
    }catch(e){}
  }
  return null;
}
async function fetchStockPrices(){
  const key=(state.settings.apiKey||'').trim();
  const syms=[...new Set(state.positions.filter(p=>p.kind==='stock').map(p=>p.symbol))];
  if(!syms.length||stockBusy)return;
  stockBusy=true;
  try{
    let ok=0,auth=false,limit=false;
    for(let i=0;i<syms.length;i++){
      const s=syms[i]; let got=false;
      if(key){ const mic=stockMic(s);
        const url=`https://api.twelvedata.com/quote?symbol=${encodeURIComponent(s)}${mic?`&mic_code=${mic}`:''}&apikey=${encodeURIComponent(key)}`;
        try{ const r=await fetch(url); const d=await r.json();
          if(d.code===401||d.code===403){auth=true;}
          else if(d.code===429){limit=true;}
          else { let px=parseFloat(d.close), cur=d.currency||stockHomeCur({symbol:s});
            if(cur==='GBp'||cur==='GBX'){ px/=100; cur='GBP'; }
            if(px>0){ state.cache.stockPrices[s]={price:px,cur,dayPct:(d.percent_change!=null&&d.percent_change!==''?parseFloat(d.percent_change):null),ts:Date.now()}; ok++; got=true; state.cache.stockUpdated=Date.now(); renderAll(); }
          }
        }catch(e){}
        if(auth)break;
      }
      if(!got){ const y=await fetchYahoo(s); if(y){ state.cache.stockPrices[s]={...y,ts:Date.now()}; ok++; state.cache.stockUpdated=Date.now(); renderAll(); } }
      if(i<syms.length-1) await new Promise(r=>setTimeout(r, key?8000:1500)); // pausa maior se usa Twelve Data (8/min)
    }
    if(auth){toast('Chave da API inválida — verifica nas Definições',1);}
    else if(limit&&!ok){toast('Limite da API atingido — a manter últimos preços',1);}
    if(ok){ save(); setStatus(true); }
  } finally { stockBusy=false; }
}

  state.cash.forEach(c=>{const k=c.platform||'Outra';byP[k]=(byP[k]||0)+conv(cashBal(c),c.currency);});

function fmtFee(){ return (state.settings.fxFeePct||0).toString().replace('.',','); }
const NO_FX_FEE=['Trade Republic','Revolut'];
function feeFor(platform){ return NO_FX_FEE.includes(platform) ? 0 : (state.settings.fxFeePct||0)/100; }
function lotCalc(mode, moneyCur, priceCur, v){ // devolve {units, cost, priceQ, priceCur, price, feeApplied, exact, ok}
  const fee=feeFor(v.platform), cross=priceCur&&priceCur!==moneyCur;
  if(mode==='stockN'){ if(!(v.shares>0)||!(v.priceQ>0))return{ok:false};
    let cost, feeApplied=false, exact=false;
    if(v.cost>0){ cost=v.cost; exact=true; }
    else if(v.rate>0){ cost=v.shares*v.priceQ*v.rate; exact=true; }
    else { cost=v.shares*v.priceQ*conv(1,priceCur,moneyCur)*(cross?(1+fee):1); feeApplied=cross; }
    return {units:v.shares,cost,priceQ:v.priceQ,priceCur,price:cost/v.shares,feeApplied,exact,ok:true}; }
  if(mode==='cost'){ if(!(v.shares>0)||!(v.cost>0))return{ok:false};
    return {units:v.shares,cost:v.cost,priceQ:null,price:v.cost/v.shares,feeApplied:false,ok:true}; }
  if(!(v.price>0)||!(v.amount>0))return{ok:false};
  return {units:v.amount/v.price,cost:v.amount,priceQ:v.price,priceCur:moneyCur,price:v.price,feeApplied:false,ok:true};
}
function draftEntry(){
  const moneyCur=draft.currency;
  if(draft.kind==='stock'){ const priceCur=draft.priceCur||(draft.stock?draft.stock.c:moneyCur);
    const v={shares:parseFloat($('#dShares')?.value), priceQ:parseFloat($('#dPQ')?.value), platform:draft.platform};
    if(draft.adjust==='cost') v.cost=parseFloat($('#dCost')?.value);
    else if(draft.adjust==='rate') v.rate=parseFloat($('#dRate')?.value);
    return lotCalc('stockN', moneyCur, priceCur, v); }
  return lotCalc(draft.entryMode==='cost'?'cost':'amount', moneyCur, moneyCur, {shares:parseFloat($('#dShares')?.value), cost:parseFloat($('#dCost')?.value), price:parseFloat($('#dEntry')?.value), amount:parseFloat($('#dAmt')?.value)});
}

function modalClose(id){
  const p=state.positions.find(x=>x.id===id); if(!p)return;
  const m=metrics(p), exCur=m.nativeCur, prefill=m.nativePrice;
  const cross=exCur!==p.currency, csym=sym(p.currency).trim(), fee=feeFor(p.platform);
  let adj='auto';
  openM(`<div class="mh"><h3>Fechar posição</h3><button class="x" onclick="closeM()">✕</button></div>
    <div class="picked" style="margin-bottom:16px;background:var(--surface-2);border-color:var(--line-2)">

      <div><div class="rn">${esc(p.name)}</div><div class="rs">${units(m.u)} · ${esc(p.platform)} · resultado em ${csym}</div></div></div>
    <div class="field"><label>Preço de saída (${exCur})</label>
      <input class="inp mono" id="cExit" type="number" step="any" inputmode="decimal" value="${prefill.toFixed(Math.abs(prefill)<1?8:4)}"></div>
    ${cross?`<div id="cAdjArea"></div>`:''}

      <button class="btn pri" id="cDo" style="justify-content:center">Confirmar fecho</button></div>`);
  const proceeds=()=>{ const ex=parseFloat($('#cExit')?.value)||0;
    if(cross){ if(adj==='recv')return parseFloat($('#cRecv')?.value)||0;
      if(adj==='rate'){ const rt=parseFloat($('#cRate')?.value)||0; return m.u*ex*rt; }
      return conv(m.u*ex,exCur,p.currency)*(1-fee); } // automático: com taxa de saída
    return conv(m.u*ex,exCur,p.currency); };
  const renderCAdj=()=>{ const a=$('#cAdjArea'); if(!a)return;
    a.innerHTML=`<div class="mseg" id="cAdjMode" style="margin:2px 0 12px">
        <button data-aj="auto" class="${adj==='auto'?'on':''}">Automático</button>
        <button data-aj="recv" class="${adj==='recv'?'on':''}">Recebido €</button>
        <button data-aj="rate" class="${adj==='rate'?'on':''}">Câmbio</button></div>
      ${adj==='recv'?`<div class="field"><label>Recebido (${csym})</label><input class="inp mono" id="cRecv" type="number" step="any" inputmode="decimal" placeholder="0,00"></div><div class="curhint">O valor exato que a XTB te creditou pela venda. Fica exato.</div>`
       :adj==='rate'?`<div class="field"><label>Câmbio de fecho <span class="sublbl">1 ${sym(exCur).trim()} = ? ${csym}</span></label><input class="inp mono" id="cRate" type="number" step="any" inputmode="decimal" placeholder="ex: 0,8535"></div><div class="curhint">A taxa de câmbio da venda (já inclui a taxa).</div>`
       :`<div class="curhint">Converto ao câmbio de hoje menos <b style="color:var(--down)">${fmtFee()}% de taxa</b> de saída, como a XTB faz ao vender.</div>`}`;
    $('#cAdjMode').onclick=e=>{const b=e.target.closest('button');if(!b)return;adj=b.dataset.aj;renderCAdj();upd();};
    ['cRecv','cRate'].forEach(i=>{const el=$('#'+i);if(el)el.oninput=upd;});
  };
  const upd=()=>{const pr=proceeds(), pl=pr-m.cost, plp=m.cost>0?pl/m.cost*100:0, plc=pl>=0?'up':'down';
    $('#cPrev').innerHTML=`<div class="pr"><span>Custo</span><b>${money(m.cost,p.currency)}</b></div>

  $('#cExit').oninput=upd; if(cross)renderCAdj(); upd();

    if(!(pr>0))return toast('Indica o preço ou valor de saída',1);

    save(); closeM(); renderAll(); const pl=pr-m.cost; toast((pl>=0?'Lucro de ':'Perda de ')+money(Math.abs(pl),p.currency));};

    state.positions=[];state.closed=[];state.cash=[];save();closeM();renderAll();toast('Tudo apagado');}};

(function(){
  var cv=document.getElementById('aurC'); if(!cv||!cv.getContext) return;
  var ctx=cv.getContext('2d'), W=0,H=0, dpr=Math.min(window.devicePixelRatio||1,2), t=0, raf=null;
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var bands=[[201,169,106],[95,199,154],[124,108,224],[92,150,210]]; // dourado, jade, violeta, azul
  function size(){ W=cv.clientWidth; H=cv.clientHeight; cv.width=Math.max(1,W*dpr); cv.height=Math.max(1,H*dpr); ctx.setTransform(dpr,0,0,dpr,0,0); }
  function frame(){
    t+=16; ctx.clearRect(0,0,W,H);
    for(var b=0;b<bands.length;b++){
      var c=bands[b], yBase=H*(0.14+b*0.15), amp=H*0.15, sp=t*0.0005*(1+b*0.22), fx=b*1.3;
      ctx.beginPath(); ctx.moveTo(0,H);
      for(var x=0;x<=W;x+=16){ var y=yBase+Math.sin(x*0.0055+sp+fx)*amp+Math.sin(x*0.012+sp*1.4)*amp*0.4; ctx.lineTo(x,y); }
      ctx.lineTo(W,H); ctx.closePath();
      var g=ctx.createLinearGradient(0,yBase-amp,0,H);
      g.addColorStop(0,'rgba('+c[0]+','+c[1]+','+c[2]+',0.15)');
      g.addColorStop(0.5,'rgba('+c[0]+','+c[1]+','+c[2]+',0.05)');
      g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=g; ctx.fill();
    }
    if(!reduce) raf=requestAnimationFrame(frame);
  }
  function start(){ if(!raf&&!reduce&&!document.hidden) raf=requestAnimationFrame(frame); }
  function stop(){ if(raf){ cancelAnimationFrame(raf); raf=null; } }
  window.addEventListener('resize',size);
  document.addEventListener('visibilitychange',function(){ if(document.hidden) stop(); else start(); });
  size();
  if(reduce) frame(); else start();
})();
